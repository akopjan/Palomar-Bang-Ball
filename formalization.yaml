fidelity:
  divergences: >-
    The formalization faithfully follows the arguments of the paper. Minor formal
    adaptations: the dimension n is passed explicitly to Plank n; homothets are
    expressed using vector addition t +ᵥ r • K; IsCentrallySymmetric K is explicitly
    included as a hypothesis in ball_plank_theorem and davenport_conjecture;
    davenport_conjecture assumes functionals f i are nonzero; and Bang's open
    conjecture is stated as a definition of type Prop.

review:
  status: "author-verified"
  reviewers:
    - "Arseniy Akopyan"
  notes: "Statement and proof audited against the paper. Typechecked in Lean 4.35.0-rc2 with zero sorries and only the three standard axioms (propext, Quot.sound, Classical.choice)."

alignment:
  namespace: "PlankProblem"
  statements:
    - source: "Ball's Plank Theorem (Abstract / Theorem 1)"
      lean: "PlankProblem.ball_plank_theorem"
      module: "Solution"
      status: "proved"
      note: "If a centrally symmetric convex body K ⊆ ℝⁿ is covered by finitely many planks, the sum of their relative widths with respect to K is at least 1."
    - source: "The core theorem (page 1)"
      lean: "PlankProblem.core_theorem"
      module: "Solution"
      status: "proved"
      note: "Given an orthonormal basis X of ℝⁿ and linear functionals with ℓᵢ(xᵢ) = 1, there exists z with ‖z‖ ≤ √n outside shifted planks |ℓᵢ(z) - cᵢ| ≥ 1."
    - source: "Davenport's problem (extension discussed in paper)"
      lean: "PlankProblem.davenport_conjecture"
      module: "Solution"
      status: "proved"
      note: "Existence of a homothet of ratio 1/(n+1) of a centrally symmetric convex body K whose interior is disjoint from n given affine hyperplanes."

