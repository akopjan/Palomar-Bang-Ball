status:
  scope: >-
    Formalizes Keith Ball's plank theorem for centrally symmetric convex bodies
    (PlankProblem.ball_plank_theorem), the core theorem for linear functionals and
    shifted planks through an orthonormal basis (PlankProblem.core_theorem), and
    Davenport's problem for centrally symmetric bodies on the existence of a homothet
    K/(n+1) whose interior is disjoint from n hyperplanes (PlankProblem.davenport_conjecture).
    Bang's affine plank conjecture for general (not necessarily centrally symmetric)
    convex bodies is formulated as an open proposition (PlankProblem.BangPlankConjecture)
    without proof, as it remains an open problem in convex geometry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
